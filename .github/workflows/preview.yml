name: Preview site

# Builds the static site with a /Rami base path and publishes it to the gh-pages branch.
# In the repo settings, set Pages to "Deploy from a branch" and choose gh-pages, folder / (root).
on:
  push:
    branches: [claude/zealous-planck-r5uz4n]
    paths: ["site/**", ".github/workflows/preview.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build preview (noindex)
        run: PREVIEW=1 BASE_PATH=/${{ github.event.repository.name }} python3 site/build.py
      - name: Publish to gh-pages
        run: |
          touch site/public/.nojekyll
          cd site/public
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Preview build from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
